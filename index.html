<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trading Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      border: 1px solid #2a2d35;
      padding: 20px 28px;
      border-radius: 8px;
      max-width: 360px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 14px;
      text-align: center;
    }
    p {
      margin: 6px 0;
      font-size: 14px;
    }
    .rule {
      margin-top: 12px;
      font-weight: bold;
      color: #00ff99;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Trading Plan</h1>

    <p>Modal: $1.500</p>
    <p>Lot: 0.01</p>
    <p>Risk: $15 / hari (3x loss)</p>
    <p>Risk / trade: $5</p>
    <p>SL / TP: 50 / 100 pips (1:2)</p>
    <p>Timeframe: &lt; 5M</p>

    <p class="rule">Rule: 3 loss STOP · 2 win DONE</p>
  </div>
</body>
</html>
